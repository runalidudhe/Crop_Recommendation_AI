<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FarmNexa-AI - Login</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- =====================================================
                 LOGO
            ====================================================== -->

            <div class="logo">

                <div class="logo-icon">
                    🌱
                </div>

                <h1>
                    FarmNexa-AI
                </h1>

            </div>


            <!-- =====================================================
                 HEADING
            ====================================================== -->

            <div class="login-heading">

                <h2>
                    Welcome Back! 👋
                </h2>

                <p>
                    Login to continue to FarmNexa-AI
                </p>

            </div>


            <!-- =====================================================
                 LOGIN FORM
            ====================================================== -->

            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <!-- PASSWORD SHOW / HIDE BUTTON -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- =================================================
                     LOGIN OPTIONS
                ================================================== -->

                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    Login

                    <span>→</span>

                </button>

            </form>


            <!-- =====================================================
                 SIGNUP
            ====================================================== -->

            <div class="signup-link">

                <span>
                    Don't have an account?
                </span>

                <a href="signup.html">
                    Create Account
                </a>

            </div>


            <!-- =====================================================
                 FOOTER
            ====================================================== -->

            <div class="login-footer">

                <p>
                    🌾 Smart Agriculture with AI
                </p>

                <span>
                    Designed by Runali Dudhe
                </span>

            </div>

        </div>

    </div>


    <!-- =========================================================
         LOGIN JAVASCRIPT
    ========================================================== -->

    <script src="login.js"></script>

</body>

</html>
