<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FarmNexa-AI - Create Account</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="signup-page">

        <div class="signup-card">

            <div class="logo">
                <div class="logo-icon">🌱</div>
                <h1>FarmNexa-AI</h1>
            </div>

            <div class="signup-heading">
                <h2>Create Account 🌾</h2>
                <p>Join FarmNexa-AI for smarter farming</p>
            </div>

            <form id="signupForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account →
                </button>

            </form>


            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>


            <div class="signup-footer">

                <p>🌾 Smart Agriculture with AI</p>

                <span>
                    Designed by Runali Dudhe
                </span>

            </div>

        </div>

    </div>


    <script src="signup.js"></script>

</body>

</html>
